                      expected['runtime_materialization_review']={'policy_sha256':digest(preparation),
                          'preparer_file_cap_bytes':preparation['preparer_file_cap_bytes'],
                          'model_worker_file_cap_bytes':536870912,'large_vendor_members':preparation['large_vendor_members'],
                          'root_cpu_seconds':30,'root_address_space_bytes':268435456,
                          'session_seconds':900,'new_paid_authority':False}
                  if 'python_runtime_projection'in recipe:
                      python_policy=recipe['python_runtime_projection']
                      expected['python_runtime_projection_review']={'policy_sha256':digest(python_policy),
                          'archive_sha256':python_policy['archive_sha256'],'prefix':python_policy['prefix'],
                          'file_cap_bytes':536870912,'interpreter_execution':False,'runtime_admission_granted':False}
                  if 'guest_transfer'in recipe:
                      preparation=recipe['guest_transfer']
                      expected['guest_preparation_review']={'plan_sha256':digest(preparation),'maximum_guest_seconds':preparation['total_guest_stage_seconds'],
                          'maximum_session_seconds':900,'maximum_job_seconds':7200,'shutdown_reserve_seconds':75,
                          'credential_forwarding':False,'qualification_admitted':False,'additional_paid_authority':False}
                  if 'qualification_card'in recipe:
                      expected['qualification_card_review']={'policy_sha256':digest(recipe['qualification_card']),
                          'fresh_exec_policy_sha256':digest(recipe['qualification_exec']),
