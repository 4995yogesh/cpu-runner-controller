name: Protected CPU admission and separately authorized GPU lifecycle
run-name: CPU connected ${{ inputs.operation_id }}
on:
  workflow_dispatch:
    inputs:
      operation_id:
        description: Fresh independently reviewed scope; never reuse
        required: true
        type: string
      reviewed_control_commit:
        description: Exact private derivative commit
        required: true
        type: string
      reviewed_source_registry_sha256:
        description: Exact private derivative registry digest
        required: true
        type: string
      reviewed_execution_card_sha256:
        description: Independently reviewed split CPU execution card digest
        required: true
        type: string
      reviewed_unattended_policy_sha256:
        description: Exact CPU_UNATTENDED_FULL_PREPARATION_V1 verifier policy digest
        required: true
        type: string
      reviewed_unattended_policy_version:
        description: Exact version bound by the initial owner receipt
        required: true
        type: choice
        options:
          - CPU_UNATTENDED_FULL_PREPARATION_V1
          - CPU_ROOT_CONTEXT_DIAGNOSTIC_V2
          - CPU_GPU_HOST_TECHNICAL_ADMISSION_V1
          - CPU_STARTUP_AUTHORITY_DIAGNOSTIC_V1
      gpu_role:
        description: NONE for CPU preparation; PRECREATION for CPU-only static diagnostic; lifecycle roles separately authorized
        required: true
        type: choice
        default: NONE
        options:
          - NONE
          - CONTROLLER
          - WATCHDOG
          - PRECREATION
      reviewed_gpu_packet_commit:
        description: Private review commit containing this technical scope packet
        required: false
        type: string
      reviewed_gpu_packet_sha256:
        description: Exact private packet bytes; no credential values
        required: false
        type: string
      dispatch_authorized:
        description: One exact initial authority; technical CPU card alone never authorizes paid work
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: cpu-connected-${{ inputs.gpu_role == 'NONE' && 'preparation' || inputs.gpu_role == 'PRECREATION' && 'CONTROLLER' || inputs.gpu_role }}
  cancel-in-progress: false
jobs:
  connected-cpu:
    name: connected-cpu
    if: ${{ inputs.dispatch_authorized && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.reviewed_unattended_policy_version == 'CPU_STARTUP_AUTHORITY_DIAGNOSTIC_V1' && 12 || 120 }}
    env:
      GPU_HOST_ROLE: ${{ inputs.gpu_role == 'PRECREATION' && 'CONTROLLER' || inputs.gpu_role }}
      GPU_HOST_PACKET_COMMIT: ${{ inputs.reviewed_gpu_packet_commit }}
      GPU_HOST_PACKET_SHA256: ${{ inputs.reviewed_gpu_packet_sha256 }}
      CPU_CONTROL_COMMIT: ${{ inputs.reviewed_control_commit }}
      CPU_SOURCE_REGISTRY_SHA256: ${{ inputs.reviewed_source_registry_sha256 }}
      CPU_SCOPE_ID: ${{ inputs.operation_id }}
      CPU_CARD_SHA256: ${{ inputs.reviewed_execution_card_sha256 }}
      CPU_UNATTENDED_POLICY_SHA256: ${{ inputs.reviewed_unattended_policy_sha256 }}
      CPU_UNATTENDED_POLICY_VERSION: ${{ inputs.reviewed_unattended_policy_version }}
      CPU_APP_CLIENT_ID: ${{ vars.CPU_APP_CLIENT_ID }}
      CPU_APP_INSTALLATION_ID: ${{ vars.CPU_APP_INSTALLATION_ID }}
      CPU_PRIVATE_REPOSITORY_ID: ${{ vars.CPU_PRIVATE_REPOSITORY_ID }}
      CPU_APP_BOT_ID: ${{ vars.CPU_APP_BOT_ID }}
      CPU_REVIEW_ISSUE_NUMBER: ${{ vars.CPU_REVIEW_ISSUE_NUMBER }}
      CPU_REVIEWER_ID: ${{ vars.CPU_REVIEWER_ID }}
      CPU_DRIVE_FOLDER_ID: ${{ vars.CPU_DRIVE_FOLDER_ID }}
      CPU_EVIDENCE_PERMISSIONS_SHA256: ${{ vars.CPU_EVIDENCE_PERMISSIONS_SHA256 }}
    steps:
      - name: Authenticate owner authority and launch private CPU controller
        id: connected
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CPU_PRECREATION_DIAGNOSTIC: ${{ inputs.gpu_role == 'PRECREATION' && 'true' || 'false' }}
          GPU_HOST_ROLE_KEY: ${{ inputs.gpu_role != 'PRECREATION' && inputs.gpu_role != 'NONE' && secrets[format('VAST_{0}_API_KEY', inputs.gpu_role)] || '' }}
          GPU_GUARD_AUTH_SEED: ${{ inputs.gpu_role != 'PRECREATION' && inputs.gpu_role != 'NONE' && secrets.GPU_GUARD_AUTH_SEED || '' }}
          GPU_GUARD_DEPLOY_TOKEN: ${{ inputs.gpu_role != 'PRECREATION' && inputs.gpu_role == 'CONTROLLER' && secrets.CLOUDFLARE_WATCHDOG_DEPLOY_TOKEN || '' }}
          GPU_GUARD_PROVIDER_KEY: ${{ inputs.gpu_role != 'PRECREATION' && inputs.gpu_role == 'CONTROLLER' && secrets.VAST_WATCHDOG_API_KEY || '' }}
          GPU_SSH_PRIVATE_KEY: ${{ (inputs.gpu_role == 'CONTROLLER' || inputs.gpu_role == 'PRECREATION') && secrets.GPU_SSH_PRIVATE_KEY || '' }}
          CPU_APP_PRIVATE_KEY: ${{ secrets.CPU_APP_PRIVATE_KEY }}
          CPU_DRIVE_RCLONE_CONF: ${{ secrets.CPU_DRIVE_RCLONE_CONF }}
        run: |
          set -euo pipefail
          sudo --preserve-env=CPU_PRECREATION_DIAGNOSTIC,GITHUB_OUTPUT,GPU_GUARD_AUTH_SEED,GPU_GUARD_DEPLOY_TOKEN,GPU_GUARD_PROVIDER_KEY,GPU_SSH_PRIVATE_KEY,GPU_HOST_ROLE,GPU_HOST_PACKET_COMMIT,GPU_HOST_PACKET_SHA256,GPU_HOST_ROLE_KEY,GITHUB_ACTOR_ID,GH_TOKEN,CPU_APP_PRIVATE_KEY,CPU_DRIVE_RCLONE_CONF,CPU_CONTROL_COMMIT,CPU_SOURCE_REGISTRY_SHA256,CPU_SCOPE_ID,CPU_CARD_SHA256,CPU_UNATTENDED_POLICY_SHA256,CPU_UNATTENDED_POLICY_VERSION,CPU_APP_CLIENT_ID,CPU_APP_INSTALLATION_ID,CPU_PRIVATE_REPOSITORY_ID,CPU_APP_BOT_ID,CPU_REVIEW_ISSUE_NUMBER,CPU_REVIEWER_ID,CPU_DRIVE_FOLDER_ID,CPU_EVIDENCE_PERMISSIONS_SHA256,GITHUB_REPOSITORY,GITHUB_EVENT_NAME,GITHUB_RUN_ATTEMPT,GITHUB_SHA,GITHUB_WORKFLOW_SHA,GITHUB_RUN_ID,RUNNER_OS,ImageOS,RUNNER_NAME,GITHUB_JOB,ImageVersion,RUNNER_TEMP /usr/bin/python3 -I -S -B - <<'PY'
          import base64,datetime,hashlib,http.client,json,os,re,resource,shutil,signal,ssl,stat,subprocess,time,uuid
          from pathlib import Path
          started=time.monotonic();root=None;private=None;token=None;child=None;code=2
          root_identity=None;private_identity=None;final_app_verified=False;final_files_verified=False
          def interrupted(_signal,_frame):raise KeyboardInterrupt()
          signal.signal(signal.SIGTERM,interrupted)
          def operation_expired(_signal,_frame):
              marker=root/'controller-start.json' if root is not None else None
              if marker is not None and marker.exists() and time.monotonic()-started<7200:
                  handoff=json.loads(marker.read_bytes())
                  if handoff['started_monotonic']-started<220:
                      signal.setitimer(signal.ITIMER_REAL,max(.000001,7200-(time.monotonic()-started)));return
              raise KeyboardInterrupt()
          signal.signal(signal.SIGALRM,operation_expired);signal.setitimer(signal.ITIMER_REAL,220)
          def need(ok):
              if not ok:raise ValueError('CPU_BOOTSTRAP_BLOCKED')
          def publish_disposal_projection():
              # Native output is an existing runner-owned file, never an
              # arbitrary root write or a private evidence/credential channel.
              output=Path(os.environ['GITHUB_OUTPUT']);temporary=Path(os.environ['RUNNER_TEMP'])
              need(temporary.is_absolute() and output.is_absolute() and '..' not in output.parts
                  and output.parent==temporary/'_runner_file_commands'
                  and re.fullmatch('set_output_[0-9a-f-]{36}',output.name))
              need(all(not p.is_symlink() for p in (output,*output.parents)))
              fd=os.open(output,os.O_WRONLY|os.O_APPEND|os.O_NOFOLLOW)
              try:
                  info=os.fstat(fd)
                  need(stat.S_ISREG(info.st_mode) and info.st_nlink==1 and info.st_uid==int(os.environ['SUDO_UID'])
                      and info.st_size<=4096 and time.monotonic()<started+7200)
                  payload=('app_revoked='+str(final_app_verified).lower()+'\nfiles_disposed='+str(final_files_verified).lower()+'\n').encode()
                  need(os.write(fd,payload)==len(payload));os.fsync(fd)
              finally:os.close(fd)
          def final_token_observation(root):
              def observed(name):
                  path=root/name;before=path.lstat()
                  need(stat.S_ISREG(before.st_mode) and before.st_uid==0 and before.st_nlink==1
                      and stat.S_IMODE(before.st_mode)==0o444 and before.st_size<=4096)
                  with os.fdopen(os.open(path,os.O_RDONLY|os.O_NOFOLLOW),'rb') as stream:
                      held=os.fstat(stream.fileno());raw=stream.read(4097);after=os.fstat(stream.fileno())
                  identity=lambda item:(item.st_dev,item.st_ino,item.st_size,item.st_mtime_ns,item.st_ctime_ns)
                  need(identity(before)==identity(held)==identity(after) and len(raw)<=4096)
                  return json.loads(raw)
              proof=observed('private-authority-disposal.json')
              expected={'status':'PRIVATE_CONTROL_TOKEN_REVOKED_AND_LOCAL_INPUTS_REMOVED',
                  'control_commit':os.environ['CPU_CONTROL_COMMIT'],'registry_sha256':os.environ['CPU_SOURCE_REGISTRY_SHA256'],
                  'scope_id':os.environ['CPU_SCOPE_ID'],'execution_commit':os.environ['GITHUB_SHA'],
                  'run_id':os.environ['GITHUB_RUN_ID'],'attempt':1}
              need(proof==expected)
              if os.environ['CPU_UNATTENDED_POLICY_VERSION'] not in ('CPU_ROOT_CONTEXT_DIAGNOSTIC_V2','CPU_GPU_HOST_TECHNICAL_ADMISSION_V1','CPU_STARTUP_AUTHORITY_DIAGNOSTIC_V1'):
                  return True
              value=observed('private-http401-disposal.json');rows=value['observations']
              marker=root/'controller-start.json';need(not marker.is_symlink() and marker.stat().st_uid==0)
              driver=json.loads(marker.read_bytes())['pid']
              need(value['status']=='CPU_CONTROL_TOKEN_HTTP401_VERIFIED_V1' and value['credential_included']is False
                  and value['delete_requests']==0 and type(value['observer_pid'])is int and value['observer_pid']>0
                  and value['observer_ppid']==driver and value['observer_pid']!=driver
                  and 0<=value['wall_seconds']<20 and isinstance(rows,list) and 1<=len(rows)<=3
                  and all(row['attempt']==i+1 and row['http_status']==(401 if i==len(rows)-1 else 200)
                      and row['response_bytes']==0 for i,row in enumerate(rows)))
              return True
          def stage_guard_credentials(recipe,role,root):
              values={key:os.environ.pop(env,'').strip() for key,env in [('seed','GPU_GUARD_AUTH_SEED'),
                  ('deploy','GPU_GUARD_DEPLOY_TOKEN'),('provider','GPU_GUARD_PROVIDER_KEY')]}
              if 'external_alarm_guard' not in recipe:return
              policy=recipe.get('external_guard_handoff',{})
              need(role in ('controller','watchdog') and policy.get('version')=='PROTECTED_GPU_GUARD_HANDOFF_V1'
                  and policy.get('seed_secret')=='GPU_GUARD_AUTH_SEED'
                  and policy.get('deploy_secret')=='CLOUDFLARE_WATCHDOG_DEPLOY_TOKEN'
                  and policy.get('provider_secret')=='VAST_WATCHDOG_API_KEY')
              if not re.fullmatch('[a-f0-9]{64}',values['seed']):
                  print('{"status":"GPU_GUARD_SEED_MISSING_OR_INVALID","secret_name":"GPU_GUARD_AUTH_SEED","paid_provisioning_authorized":false}')
              need(re.fullmatch('[a-f0-9]{64}',values['seed']))
              names={'seed':'gpu-guard-seed.key','deploy':'gpu-guard-deploy.key','provider':'gpu-guard-provider.key'}
              selected=('seed','deploy','provider') if role=='controller' else ('seed',)
              need(all(0<len(values[name].encode())<=16384 and '\n' not in values[name] and '\r' not in values[name] for name in selected))
              need(role=='controller' or not values['deploy'] and not values['provider'])
              for name in selected:
                  fd=os.open(root/names[name],os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o400)
                  with os.fdopen(fd,'wb') as out:out.write(values[name].encode());out.flush();os.fsync(out.fileno())
              values.clear()
          def request(method,path,credential,body=None,raw=False):
              conn=http.client.HTTPSConnection('api.github.com',timeout=5,context=ssl.create_default_context())
              try:
                  headers={'Authorization':'Bearer '+credential,'User-Agent':'cpu-private-bootstrap','X-GitHub-Api-Version':'2026-03-10',
                           'Accept':'application/vnd.github.raw+json' if raw else 'application/vnd.github+json'}
                  if body is not None:headers['Content-Type']='application/json'
                  conn.request(method,path,body=None if body is None else json.dumps(body).encode(),headers=headers)
                  response=conn.getresponse();value=response.read(4194305)
                  need(response.status=={'GET':200,'POST':201,'DELETE':204}[method] and len(value)<=4194304)
                  return value if raw or method=='DELETE' else json.loads(value)
              finally:conn.close()
          try:
              need(os.getuid()==0 and os.environ['GITHUB_REPOSITORY']=='4995yogesh/cpu-runner-controller'
                   and os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch' and os.environ['GITHUB_RUN_ATTEMPT']=='1'
                   and os.environ['GITHUB_SHA']==os.environ['GITHUB_WORKFLOW_SHA'] and os.environ['RUNNER_OS']=='Linux'
                   and os.environ['ImageOS']=='ubuntu24' and os.environ['GITHUB_JOB']=='connected-cpu')
              for name,size in [('CPU_CONTROL_COMMIT',40),('CPU_SOURCE_REGISTRY_SHA256',64),('CPU_CARD_SHA256',64),('CPU_UNATTENDED_POLICY_SHA256',64),('CPU_SCOPE_ID',32)]:
                  need(re.fullmatch('[0-9a-f]{'+str(size)+'}',os.environ[name]))
              resource.setrlimit(resource.RLIMIT_CORE,(0,0));resource.setrlimit(resource.RLIMIT_FSIZE,(536870912,536870912))
              storage=Path('/var/lib')
              need(all(not p.is_symlink() and p.stat().st_uid==0 and not p.stat().st_mode&0o022 for p in (storage,*storage.parents)))
              root=storage/('cpu-public-bootstrap-'+os.environ['GITHUB_RUN_ID']+'-'+uuid.uuid4().hex[:12]);root.mkdir(mode=0o700)
              root_identity=(root.stat().st_dev,root.stat().st_ino)
              key=root/'app.pem';key.write_text(os.environ.pop('CPU_APP_PRIVATE_KEY'));key.chmod(0o400)
              need(0<key.stat().st_size<=16384)
              b64=lambda value:base64.urlsafe_b64encode(value).rstrip(b'=')
              stamp=int(time.time());signing=b'.'.join([b64(b'{"alg":"RS256","typ":"JWT"}'),
                  b64(json.dumps({'iat':stamp-60,'exp':stamp+540,'iss':os.environ['CPU_APP_CLIENT_ID']}).encode())])
              signature=subprocess.run(['/usr/bin/openssl','dgst','-sha256','-sign',str(key)],input=signing,capture_output=True,timeout=5,check=True).stdout
              jwt=(signing+b'.'+b64(signature)).decode();permissions={'contents':'read','issues':'write','metadata':'read'}
              repository_id=int(os.environ['CPU_PRIVATE_REPOSITORY_ID']);installation_id=int(os.environ['CPU_APP_INSTALLATION_ID'])
              need(repository_id==1401402576 and int(os.environ['CPU_REVIEWER_ID'])==183433787
                   and int(os.environ['CPU_REVIEW_ISSUE_NUMBER'])==1)
              minted=request('POST',f'/app/installations/{installation_id}/access_tokens',jwt,{'repository_ids':[repository_id],'permissions':permissions})
              token=minted.get('token')
              need(isinstance(token,str) and 0<len(token)<=16384)
              need(isinstance(minted.get('permissions'),dict) and {'metadata':'read',**minted['permissions']}==permissions)
              expiry=datetime.datetime.fromisoformat(minted['expires_at'].replace('Z','+00:00'))
              need(expiry.tzinfo is not None and 120<(expiry-datetime.datetime.now(datetime.timezone.utc)).total_seconds()<=3660)
              need(minted.get('repository_selection','all') in {'selected','all'})
              def private_rows(rows):
                  return isinstance(rows,list) and len(rows)==1 and isinstance(rows[0],dict) and rows[0].get('id')==repository_id and rows[0].get('full_name')=='4995yogesh/Phase3-cpu-probe-staging' and rows[0].get('private') is True
              if 'repositories' in minted:need(private_rows(minted['repositories']))
              actual=request('GET','/installation/repositories?per_page=100&page=1',token)
              need(actual.get('total_count')==1 and private_rows(actual.get('repositories')))
              public_token=os.environ['GH_TOKEN'];repo='4995yogesh/Phase3-cpu-probe-staging'
              public=request('GET','/repos/4995yogesh/cpu-runner-controller',public_token)
              need(public['private'] is False and public['full_name']=='4995yogesh/cpu-runner-controller'
                   and public['id']==1408565081)
              run_path='/repos/4995yogesh/cpu-runner-controller/actions/runs/'+os.environ['GITHUB_RUN_ID']
              observation_deadline=min(started+220,time.monotonic()+10)
              for observation in range(3):
                  run=request('GET',run_path,public_token)
                  need(run['repository']['id']==1408565081 and run['repository']['full_name']=='4995yogesh/cpu-runner-controller' and run['repository']['private'] is False)
                  need(str(run['id'])==os.environ['GITHUB_RUN_ID'] and run['head_sha']==os.environ['GITHUB_SHA'])
                  need(run['event']=='workflow_dispatch' and run['run_attempt']==1)
                  need(run['actor']['id']==run['triggering_actor']['id']==183433787)
                  need(run['path'].split('@',1)[0]=='.github/workflows/cpu-connected-preparation.yml')
                  need(run['display_title']=='CPU connected '+os.environ['CPU_SCOPE_ID'])
                  need(time.monotonic()<=observation_deadline)
                  if run['status']=='in_progress':break
                  need(run['status']=='queued' and run.get('conclusion') is None and observation<2)
                  need(time.monotonic()+0.25<observation_deadline);time.sleep(0.25)
              need(run['status']=='in_progress')
              policies={'CPU_UNATTENDED_FULL_PREPARATION_V1':'CPU_PUBLIC_RUNNER_FULL_PREPARATION_INITIAL_V1',
                  'CPU_ROOT_CONTEXT_DIAGNOSTIC_V2':'CPU_PUBLIC_RUNNER_ROOT_CONTEXT_INITIAL_V2',
                  'CPU_GPU_HOST_TECHNICAL_ADMISSION_V1':'GPU_CREATION_ARMING_INITIAL_V1',
                  'CPU_STARTUP_AUTHORITY_DIAGNOSTIC_V1':'CPU_STARTUP_AUTHORITY_INITIAL_V1'}
              version=os.environ['CPU_UNATTENDED_POLICY_VERSION'];need(version in policies)
              prefix=policies[version]
              expected={'execution_repository':'4995yogesh/cpu-runner-controller','execution_commit':os.environ['GITHUB_SHA'],
                  'control_repository':repo,'control_commit':os.environ['CPU_CONTROL_COMMIT'],'review_repository':repo,
                  'registry_sha256':os.environ['CPU_SOURCE_REGISTRY_SHA256'],'scope_id':os.environ['CPU_SCOPE_ID'],
                  'card_sha256':os.environ['CPU_CARD_SHA256'],'research_commit':'d96163157c9849e146933cd88e4a87df2120a5c3',
                  'approved':True,'test_evidence':False,'paid_spend_ceiling_inr':0,
                  'unattended_policy_version':version,'unattended_policy_sha256':os.environ['CPU_UNATTENDED_POLICY_SHA256']}
              replay=[]
              for page in range(1,21):
                  previous=request('GET',f'/repos/4995yogesh/cpu-runner-controller/actions/workflows/{run["workflow_id"]}/runs?event=workflow_dispatch&per_page=100&page={page}',public_token)['workflow_runs']
                  replay.extend(r for r in previous if r.get('display_title')==run['display_title'])
                  if len(previous)<100:break
              else:raise ValueError('CPU_BOOTSTRAP_BLOCKED')
              need(len(replay)==1 and str(replay[0]['id'])==os.environ['GITHUB_RUN_ID'] and replay[0]['run_attempt']==1)
              cpu_expected=dict(expected);gpu_packet=None
              role=os.environ['GPU_HOST_ROLE'].lower()
              if version=='CPU_GPU_HOST_TECHNICAL_ADMISSION_V1':
                  need(role in {'controller','watchdog'})
                  for field,size in [('GPU_HOST_PACKET_COMMIT',40),('GPU_HOST_PACKET_SHA256',64)]:
                      need(re.fullmatch('[0-9a-f]{'+str(size)+'}',os.environ[field]))
                  review=request('GET',f'/repos/{repo}/git/commits/'+os.environ['GPU_HOST_PACKET_COMMIT'],token)
                  nodes=request('GET',f'/repos/{repo}/git/trees/'+review['tree']['sha']+'?recursive=1',token)
                  need(review['sha']==os.environ['GPU_HOST_PACKET_COMMIT'] and nodes['truncated'] is False)
                  name='operations/gpu_launch_packets/'+os.environ['CPU_SCOPE_ID']+'.json'
                  matches=[n for n in nodes['tree'] if n['path']==name and n['mode']=='100644' and n['type']=='blob']
                  need(len(matches)==1)
                  packet_raw=request('GET',f'/repos/{repo}/git/blobs/'+matches[0]['sha'],token,raw=True)
                  need(0<len(packet_raw)<=262144 and hashlib.sha256(packet_raw).hexdigest()==os.environ['GPU_HOST_PACKET_SHA256'])
                  gpu_packet=json.loads(packet_raw);recipe=gpu_packet['recipe']
                  need(set(gpu_packet)=={'schema','version','role','recipe','prepared','native_graph'} and gpu_packet['schema']==1
                       and gpu_packet['version']=='GPU_HOSTED_SESSION_CONNECTION_V1' and gpu_packet['role']==role)
                  def digest(value):return hashlib.sha256((json.dumps(value,sort_keys=True,indent=2,allow_nan=False)+'\n').encode()).hexdigest()
                  scope=recipe['execution_scope_id'];need(re.fullmatch('[0-9a-f]{32}',scope))
                  need(hashlib.sha256(('GPU_HOSTED_SESSION_CONNECTION_V1:'+scope+':'+role).encode()).hexdigest()[:32]==os.environ['CPU_SCOPE_ID'])
                  need(recipe['native_private_control']['code_commit']==os.environ['CPU_CONTROL_COMMIT']
                       and recipe['native_private_control']['registry_sha256']==os.environ['CPU_SOURCE_REGISTRY_SHA256']
                       and recipe['hosted_watchdog']['execution_commit']==os.environ['GITHUB_SHA']
                       and recipe['hosted_cpu_admission']['cards_sha256'][role]==os.environ['CPU_CARD_SHA256'])
                  diagnostic=os.environ['CPU_PRECREATION_DIAGNOSTIC']=='true'
                  need(diagnostic==('cpu_precreation_diagnostic' in recipe))
                  cap=recipe['session_cap_inr']
                  need((type(cap)is int and cap==0 and role=='controller' and recipe['operation']=='cpu-precreation-diagnostic-v1') if diagnostic else (type(cap)in(int,float) and 0<cap<=500))
                  expected={'approved':True,'recipe_sha256':digest(recipe),
                      'operation_authority_sha256':recipe['hosted_watchdog']['operation_authority_sha256'],
                      'scope_id':scope,'attempt':1,'paid_spend_ceiling_inr':cap,'test_evidence':False}
                  if diagnostic:expected['cpu_only_precreation_review']=recipe['cpu_precreation_diagnostic']
                  if 'guest_runtime_materialization' in recipe:
                      preparation=recipe['guest_runtime_materialization']
                      need(recipe.get('guest_runtime_materialization_authorized') is True
