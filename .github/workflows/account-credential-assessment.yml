name: Independent read-only timer diagnostic
run-name: CF timer ${{ inputs.scope_id }}
on:
  workflow_dispatch:
    inputs:
      scope_id:
        required: true
        type: string
      reviewed_control_commit:
        required: true
        type: string
      reviewed_source_manifest_sha256:
        required: true
        type: string
      reviewed_card_sha256:
        required: true
        type: string
      reviewed_card_blob_sha:
        required: true
        type: string
      assessment_authorized:
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: cpu-connected-preparation
  cancel-in-progress: false
jobs:
  external-timer:
    name: external-timer
    if: ${{ inputs.assessment_authorized && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      CPU_SCOPE_ID: ${{ inputs.scope_id }}
      CPU_CONTROL_COMMIT: ${{ inputs.reviewed_control_commit }}
      CPU_SOURCE_REGISTRY_SHA256: ${{ inputs.reviewed_source_manifest_sha256 }}
      CPU_CARD_SHA256: ${{ inputs.reviewed_card_sha256 }}
      CF_CARD_BLOB_SHA: ${{ inputs.reviewed_card_blob_sha }}
      CPU_EXPECTED_APP_ID: '5241292'
      CPU_APP_CLIENT_ID: ${{ vars.CPU_APP_CLIENT_ID }}
      CPU_APP_INSTALLATION_ID: ${{ vars.CPU_APP_INSTALLATION_ID }}
      CPU_PRIVATE_REPOSITORY_ID: ${{ vars.CPU_PRIVATE_REPOSITORY_ID }}
      CPU_APP_BOT_ID: ${{ vars.CPU_APP_BOT_ID }}
      CPU_REVIEW_ISSUE_NUMBER: ${{ vars.CPU_REVIEW_ISSUE_NUMBER }}
      CPU_REVIEWER_ID: ${{ vars.CPU_REVIEWER_ID }}
      CPU_DRIVE_FOLDER_ID: ${{ vars.CPU_DRIVE_FOLDER_ID }}
    steps:
      - name: Run private single-attempt timer rehearsal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CPU_APP_PRIVATE_KEY: ${{ secrets.CPU_APP_PRIVATE_KEY }}
          CPU_DRIVE_RCLONE_CONF: ${{ secrets.CPU_DRIVE_RCLONE_CONF }}
          CLOUDFLARE_WATCHDOG_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_WATCHDOG_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          sudo --preserve-env=GH_TOKEN,CPU_APP_PRIVATE_KEY,CPU_DRIVE_RCLONE_CONF,CLOUDFLARE_WATCHDOG_DEPLOY_TOKEN,CPU_SCOPE_ID,CPU_CONTROL_COMMIT,CPU_SOURCE_REGISTRY_SHA256,CPU_CARD_SHA256,CF_CARD_BLOB_SHA,CPU_EXPECTED_APP_ID,CPU_APP_CLIENT_ID,CPU_APP_INSTALLATION_ID,CPU_PRIVATE_REPOSITORY_ID,CPU_APP_BOT_ID,CPU_REVIEW_ISSUE_NUMBER,CPU_REVIEWER_ID,CPU_DRIVE_FOLDER_ID,GITHUB_REPOSITORY,GITHUB_EVENT_NAME,GITHUB_RUN_ATTEMPT,GITHUB_SHA,GITHUB_WORKFLOW_SHA,GITHUB_RUN_ID,GITHUB_ACTOR_ID,GITHUB_JOB,RUNNER_OS,ImageOS,RUNNER_NAME /usr/bin/python3 -I -S -B - <<'PY'
          import base64,datetime,hashlib,http.client,json,os,re,resource,shutil,signal,ssl,subprocess,time,uuid
          from pathlib import Path
          os.umask(0o077)
          started=time.monotonic();deadline=started+840;root=None;identity=None;token=None;child=None;code=2
          phase="NATIVE_CONTEXT";failure_boundary=None;credential_materialization_attempted=False
          token_mint_attempted=False;token_revocation_verified=False;local_credential_disposal_verified=False
          revocation_observation={'delete_http_status':None,'probe_http_status':None,'failure_boundary':None}
          def need(ok,label=None):
              global phase
              if not ok:
                  if label is not None:phase=label
                  raise ValueError('ACCOUNT_ASSESSMENT_BOUNDARY')
          def decode(raw):
              def pairs(items):
                  value={}
                  for k,v in items:
                      need(k not in value);value[k]=v
                  return value
              return json.loads(raw,object_pairs_hook=pairs,parse_constant=lambda _:need(False))
          def encode(value):return (json.dumps(value,sort_keys=True,indent=2,allow_nan=False)+'\n').encode()
          def save(path,raw,mode=0o600):
              fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,mode)
              with os.fdopen(fd,'wb') as out:out.write(raw)
          def interrupted(_s,_f):
              left=deadline-time.monotonic()
              if left>0:signal.setitimer(signal.ITIMER_REAL,left)
              raise KeyboardInterrupt()
          signal.signal(signal.SIGALRM,interrupted);signal.signal(signal.SIGTERM,interrupted)
          signal.setitimer(signal.ITIMER_REAL,820)
          def request(method,path,credential,payload=None,raw=False,observation=None):
              conn=http.client.HTTPSConnection('api.github.com',timeout=5,context=ssl.create_default_context())
              try:
                  headers={'Authorization':'Bearer '+credential,'User-Agent':'cpu-account-bootstrap','X-GitHub-Api-Version':'2026-03-10',
                      'Accept':'application/vnd.github.raw+json' if raw else 'application/vnd.github+json'}
                  if payload is not None:headers['Content-Type']='application/json'
                  conn.request(method,path,body=None if payload is None else encode(payload),headers=headers)
                  response=conn.getresponse();value=response.read(4194305)
                  if observation is not None:observation['delete_http_status']=response.status
                  need(response.status=={'GET':200,'POST':201,'DELETE':204}[method] and len(value)<=4194304)
                  return value if raw or method=='DELETE' else decode(value)
              finally:conn.close()
          def fresh_revocation_probe(path,timeout):
              check="import http.client,json,ssl,sys;from pathlib import Path;k=Path(sys.argv[1]).read_text();c=http.client.HTTPSConnection('api.github.com',timeout=4,context=ssl.create_default_context());c.request('GET','/installation/repositories',headers={'Authorization':'Bearer '+k,'User-Agent':'timer-revocation-check'});r=c.getresponse();r.read(4097);c.close();print(json.dumps({'http_status':r.status}))"
              observed=subprocess.run(['/usr/bin/python3','-I','-S','-B','-c',check,str(path)],capture_output=True,
                  env={'PATH':'/usr/bin:/bin','LANG':'C.UTF-8'},timeout=timeout)
              need(observed.returncode==0 and not observed.stderr and len(observed.stdout)<=128)
              value=decode(observed.stdout)
              need(set(value)=={'http_status'} and type(value['http_status']) is int and 100<=value['http_status']<=599)
              return value['http_status']
          try:
              need(os.getuid()==0,'NATIVE_UID')
              need(os.environ.get('GITHUB_REPOSITORY')=='4995yogesh/cpu-runner-controller','NATIVE_REPOSITORY')
              need(os.environ.get('GITHUB_EVENT_NAME')=='workflow_dispatch','NATIVE_EVENT')
              need(os.environ.get('GITHUB_RUN_ATTEMPT')=='1','NATIVE_ATTEMPT')
              need(os.environ.get('GITHUB_ACTOR_ID')=='183433787','NATIVE_ACTOR')
              need(os.environ.get('GITHUB_JOB')=='external-timer','NATIVE_JOB')
              need(os.environ.get('GITHUB_SHA') and os.environ['GITHUB_SHA']==os.environ.get('GITHUB_WORKFLOW_SHA'),'NATIVE_WORKFLOW_COMMIT')
              need(os.environ.get('RUNNER_OS')=='Linux','NATIVE_OS')
              need(os.environ.get('ImageOS')=='ubuntu24','NATIVE_IMAGE')
              phase='INPUT_BINDINGS'
              for name,size in [('CPU_SCOPE_ID',32),('CPU_CONTROL_COMMIT',40),('CPU_SOURCE_REGISTRY_SHA256',64),('CPU_CARD_SHA256',64),('CF_CARD_BLOB_SHA',40)]:
                  need(re.fullmatch('[0-9a-f]{'+str(size)+'}',os.environ[name]))
              account={'app_client_id':os.environ['CPU_APP_CLIENT_ID'],'installation_id':int(os.environ['CPU_APP_INSTALLATION_ID']),
                  'private_repository_id':int(os.environ['CPU_PRIVATE_REPOSITORY_ID']),'bot_user_id':int(os.environ['CPU_APP_BOT_ID']),
                  'review_issue':int(os.environ['CPU_REVIEW_ISSUE_NUMBER']),'reviewer_id':int(os.environ['CPU_REVIEWER_ID']),
                  'drive_folder_id':os.environ['CPU_DRIVE_FOLDER_ID'],'unused_webhooks_disabled':True}
              need(account['private_repository_id']==1401402576 and account['reviewer_id']==183433787 and account['review_issue']==1)
              public=os.environ['GH_TOKEN'];repo='4995yogesh/cpu-runner-controller';private='4995yogesh/Phase3-cpu-probe-staging'
              phase='PUBLIC_RUN_READ'
              run_path='/repos/'+repo+'/actions/runs/'+os.environ['GITHUB_RUN_ID']
              observation_deadline=min(deadline-10,time.monotonic()+10)
              for observation in range(3):
                  phase='PUBLIC_RUN_READ';run=request('GET',run_path,public)
                  phase='PUBLIC_RUN_REPOSITORY';need(run['repository']['id']==1408565081 and run['repository']['full_name']==repo and run['repository']['private'] is False)
                  phase='PUBLIC_RUN_ID';need(str(run['id'])==os.environ['GITHUB_RUN_ID'])
                  phase='PUBLIC_RUN_COMMIT';need(run['head_sha']==os.environ['GITHUB_SHA'])
                  phase='PUBLIC_RUN_EVENT';need(run['event']=='workflow_dispatch')
                  phase='PUBLIC_RUN_ATTEMPT';need(run['run_attempt']==1)
                  phase='PUBLIC_RUN_ACTOR';need(run['actor']['id']==183433787)
                  phase='PUBLIC_RUN_TRIGGERING_ACTOR';need(run['triggering_actor']['id']==183433787)
                  phase='PUBLIC_RUN_WORKFLOW';need(run['path'].split('@',1)[0]=='.github/workflows/account-credential-assessment.yml')
                  phase='PUBLIC_RUN_SCOPE';need(run['display_title']=='CF timer '+os.environ['CPU_SCOPE_ID'])
                  phase='PUBLIC_RUN_STATUS';need(time.monotonic()<=observation_deadline)
                  if run['status']=='in_progress':break
                  # Only the same exactly authenticated run may be observed
                  # again while queued; no terminal/unknown status is admitted.
                  need(run['status']=='queued' and run.get('conclusion') is None and observation<2)
                  need(time.monotonic()+0.25<observation_deadline);time.sleep(0.25)
              need(run['status']=='in_progress')
              phase='PUBLIC_JOB_READ'
              jobs=request('GET','/repos/'+repo+'/actions/runs/'+os.environ['GITHUB_RUN_ID']+'/jobs?per_page=100',public)
              phase='PUBLIC_JOB_IDENTITY'
              need(jobs['total_count']==1 and len(jobs['jobs'])==1);job=jobs['jobs'][0]
              need(job['name']=='external-timer' and job['status']=='in_progress' and job['runner_name']==os.environ['RUNNER_NAME']
                  and job['run_id']==run['id'] and job['run_attempt']==1 and job['head_sha']==os.environ['GITHUB_SHA'])
              phase='PUBLIC_JOB_LIFETIME'
              age=(datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(job['started_at'].replace('Z','+00:00'))).total_seconds()
              need(0<=age<820);deadline=min(deadline,time.monotonic()+840-age)
              need(deadline-time.monotonic()>20);signal.setitimer(signal.ITIMER_REAL,deadline-time.monotonic()-20)
              phase='PUBLIC_SCOPE_HISTORY'
              matched=[]
              for page in range(1,21):
                  rows=request('GET',f'/repos/{repo}/actions/workflows/{run["workflow_id"]}/runs?event=workflow_dispatch&per_page=100&page={page}',public)['workflow_runs']
                  matched.extend(r for r in rows if r.get('display_title')==run['display_title'])
                  if len(rows)<100:break
              else:raise ValueError('ACCOUNT_ASSESSMENT_BOUNDARY')
              need(len(matched)==1 and matched[0]['id']==run['id'] and matched[0]['run_attempt']==1)
              phase='FRESH_HOST_CAPACITY'
              mem={line.split(':',1)[0]:line.split(':',1)[1].strip() for line in Path('/proc/meminfo').read_text().splitlines()}
              need(int(mem['MemTotal'].split()[0])*1024>=7348420608 and os.cpu_count()>=2)
              phase='RESOURCE_LIMITS'
              resource.setrlimit(resource.RLIMIT_CORE,(0,0));resource.setrlimit(resource.RLIMIT_AS,(268435456,268435456))
              resource.setrlimit(resource.RLIMIT_CPU,(30,30));resource.setrlimit(resource.RLIMIT_NOFILE,(64,64));resource.setrlimit(resource.RLIMIT_FSIZE,(536870912,536870912))
              phase='PROTECTED_STORAGE'
              storage=Path('/var/lib');need(all(not p.is_symlink() and p.stat().st_uid==0 and not p.stat().st_mode&0o022 for p in (storage,*storage.parents)))
              root=storage/('cf-timer-rehearsal-'+str(run['id'])+'-1-'+uuid.uuid4().hex[:12]);root.mkdir(mode=0o700)
              identity=(root.stat().st_dev,root.stat().st_ino)
              phase='APP_KEY_INPUT';credential_materialization_attempted=True
              raw=os.environ.pop('CPU_APP_PRIVATE_KEY');need(0<len(raw.encode())<=16384);save(root/'app.pem',raw.encode(),0o400);raw=None
              b64=lambda value:base64.urlsafe_b64encode(value).rstrip(b'=')
              stamp=int(time.time());signed=b'.'.join([b64(b'{"alg":"RS256","typ":"JWT"}'),b64(encode({'iss':account['app_client_id'],'iat':stamp-60,'exp':stamp+540}))])
              phase='APP_KEY_SIGNING'
              signature=subprocess.run(['/usr/bin/openssl','dgst','-sha256','-sign',str(root/'app.pem')],input=signed,capture_output=True,timeout=5,check=True).stdout
              jwt=(signed+b'.'+b64(signature)).decode();permissions={'contents':'read','issues':'write','metadata':'read'}
              phase='APP_AUTHORITY'
              app=request('GET','/app',jwt)
              need(app['id']==int(os.environ['CPU_EXPECTED_APP_ID']) and app['owner']['id']==183433787 and app['permissions']==permissions and app['events']==[])
              phase='INSTALLATION_AUTHORITY'
              installs=request('GET','/app/installations?per_page=100&page=1',jwt)
              need(len(installs)==1);install=installs[0]
              need(install['id']==account['installation_id'] and install['app_id']==app['id'] and install['account']['id']==183433787
                  and install['account']['type']=='User' and install['permissions']==permissions and install['repository_selection']=='selected')
              phase='INSTALLATION_TOKEN_MINT';token_mint_attempted=True
              minted=request('POST',f'/app/installations/{account["installation_id"]}/access_tokens',jwt,{'permissions':permissions});token=minted.get('token')
              phase='TOKEN_RESPONSE_TOKEN';need(isinstance(token,str) and 0<len(token)<=16384)
              phase='TOKEN_RESPONSE_PERMISSIONS';need(isinstance(minted.get('permissions'),dict) and {'metadata':'read',**minted['permissions']}==permissions)
              phase='TOKEN_RESPONSE_EXPIRY'
              expiry=datetime.datetime.fromisoformat(minted['expires_at'].replace('Z','+00:00'))
              need(expiry.tzinfo is not None and 120<(expiry-datetime.datetime.now(datetime.timezone.utc)).total_seconds()<=3660)
              phase='TOKEN_RESPONSE_DESCRIPTOR';need(minted.get('repository_selection','all') in {'selected','all'})
              def private_rows(rows):
                  return isinstance(rows,list) and len(rows)==1 and isinstance(rows[0],dict) and rows[0].get('id')==1401402576 and rows[0].get('full_name')==private and rows[0].get('private') is True
              if 'repositories' in minted:
                  phase='TOKEN_RESPONSE_DECLARED_REPOSITORIES';need(private_rows(minted['repositories']))
              phase='TOKEN_ACTUAL_REPOSITORIES'
              actual=request('GET','/installation/repositories?per_page=100&page=1',token)
              need(actual.get('total_count')==1 and private_rows(actual.get('repositories')))
              phase='PRIVATE_ISSUE_AUTHORITY'
              issue=request('GET',f'/repos/{private}/issues/1',token)
              need(issue['state']=='open' and 'pull_request' not in issue and issue['user']['id']==183433787)
              expected={'scope_id':os.environ['CPU_SCOPE_ID'],'card_sha256':os.environ['CPU_CARD_SHA256'],
                  'attempt':1,'approved':True,'test_evidence':False,'paid_spend_ceiling_inr':0,
                  'cloudflare_cpu_policy':'WORKERS_FREE_PLATFORM_DEFAULTS_V1','cloudflare_read_only':True}
              phase='PRIVATE_OWNER_RECEIPT'
              found=[];claimed=[]
              for page in range(1,21):
                  rows=request('GET',f'/repos/{private}/issues/1/comments?per_page=100&page={page}',token)
                  for row in rows:
                      body=row.get('body','')
                      if body.startswith('CF_TIMER_SCOPE_CLAIM_V1\n') and os.environ['CPU_SCOPE_ID'] in body:claimed.append(row['id'])
                      if not body.startswith('CF_TIMER_DIAGNOSTIC_INITIAL_V1\n') or os.environ['CPU_SCOPE_ID'] not in body:continue
                      need(row['user']['id']==183433787 and row['user']['type']=='User' and row['author_association']=='OWNER'
                          and row['created_at']==row['updated_at'] and encode(decode(body.split('\n',1)[1]))==encode(expected))
                      age=(datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(row['created_at'].replace('Z','+00:00'))).total_seconds()
                      need(0<=age<=3600);found.append(row['id'])
                  if len(rows)<100:break
              else:raise ValueError('ACCOUNT_ASSESSMENT_BOUNDARY')
              need(len(found)==1 and not claimed)
              phase='PRIVATE_CARD'
              card_raw=request('GET',f'/repos/{private}/git/blobs/'+os.environ['CF_CARD_BLOB_SHA'],token,raw=True)
              need(hashlib.sha1(b'blob '+str(len(card_raw)).encode()+b'\0'+card_raw).hexdigest()==os.environ['CF_CARD_BLOB_SHA'])
              need(hashlib.sha256(card_raw).hexdigest()==os.environ['CPU_CARD_SHA256']);card=decode(card_raw)
              need(card['scope_id']==os.environ['CPU_SCOPE_ID'] and card['source_commit']==os.environ['CPU_CONTROL_COMMIT']
                  and card['source_manifest_sha256']==os.environ['CPU_SOURCE_REGISTRY_SHA256'] and card['execution_commit']==os.environ['GITHUB_SHA'])
              need(card['maximum_seconds']==840 and card['paid_spend_ceiling_inr']==0 and card['attempts']==1
                  and card['gpu_authorized'] is False and card['provider_operations']==0 and card['account_binding']==account
                  and card['expected_app_id']==app['id'] and card['version']=='CF_PRIVATE_TIMER_DIAGNOSTIC_V1'
                  and card['operation']=='external-timer-diagnostic' and card['read_only_cloudflare'] is True)
              phase='ABSOLUTE_AUTHORIZATION_DEADLINE'
              authority_end=datetime.datetime.fromisoformat(card['authorization_expires_utc'])
              need(authority_end.tzinfo is not None and authority_end.utcoffset()==datetime.timedelta(0))
              remaining=(authority_end-datetime.datetime.now(datetime.timezone.utc)).total_seconds()
              need(620<=remaining<=86400)
              deadline=min(deadline,time.monotonic()+remaining)
              signal.setitimer(signal.ITIMER_REAL,max(.000001,deadline-time.monotonic()-20))
              save(root/'card.json',card_raw,0o400)
              phase='PRIVATE_SOURCE_COMMIT'
              commit=request('GET',f'/repos/{private}/git/commits/'+os.environ['CPU_CONTROL_COMMIT'],token)
              need(commit['sha']==os.environ['CPU_CONTROL_COMMIT'])
              tree=request('GET',f'/repos/{private}/git/trees/'+commit['tree']['sha']+'?recursive=1',token)
              need(tree['truncated'] is False);entries={r['path']:r for r in tree['tree']};total=0
              def fetch(path):
                  global total
                  row=entries[path];need(row['type']=='blob' and row['mode']=='100644')
                  value=request('GET',f'/repos/{private}/git/blobs/'+row['sha'],token,raw=True);total+=len(value)
                  need(total<=262144 and hashlib.sha1(b'blob '+str(len(value)).encode()+b'\0'+value).hexdigest()==row['sha'])
                  return value
              base='operations/external_watchdog_probe/'
              raw=fetch(base+'hosted-source.json');need(hashlib.sha256(raw).hexdigest()==os.environ['CPU_SOURCE_REGISTRY_SHA256'])
              manifest=decode(raw);save(root/'hosted-source.json',raw,0o400)
              expected_paths={base+n:n for n in ['hosted.py','cloudflare.py','worker.mjs','workflow.candidate.yml']}
              expected_paths.update({'operations/public_runner_runtime/'+n:n for n in ['bridge.py','secure_drive.py','private_evidence.py']})
              need(set(manifest['files'])==set(expected_paths))
              for path,name in expected_paths.items():
                  raw=fetch(path);need(manifest['files'][path]=={'local_name':name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
                  save(root/name,raw,0o400)
              public_template=request('GET',f'/repos/{repo}/contents/.github/workflows/account-credential-assessment.yml?ref='+os.environ['GITHUB_SHA'],public,raw=True)
              need(public_template==(root/'workflow.candidate.yml').read_bytes())
              phase='PRIVATE_SCOPE_CLAIM'
              claim_body='CF_TIMER_SCOPE_CLAIM_V1\n'+encode({'scope_id':card['scope_id'],'attempt':1,
                  'card_sha256':os.environ['CPU_CARD_SHA256'],'run_id':str(run['id']),'execution_commit':run['head_sha']}).decode()
              claim=request('POST',f'/repos/{private}/issues/1/comments',token,{'body':claim_body})
              need(claim['user']['id']==339785233 and claim['user']['type']=='Bot' and claim['body']==claim_body and claim['created_at']==claim['updated_at'])
              # Only now may the reviewed private consumer use the saved account secrets.
              phase='CREDENTIAL_STAGING'
              for env,name,mode in [('CPU_DRIVE_RCLONE_CONF','incoming.conf',0o600),('CLOUDFLARE_WATCHDOG_DEPLOY_TOKEN','cf-token',0o400)]:
                  raw=os.environ.pop(env);need(0<len(raw.encode())<=16384);save(root/name,raw.encode(),mode);raw=None
              save(root/'installation-token',token.encode(),0o400)
              save(root/'job.json',encode({'owner_authenticated':True,'scope_claimed':True,'card_sha256':os.environ['CPU_CARD_SHA256'],
                  'scope_id':card['scope_id'],'run_id':str(run['id']),'job_id':job['id'],'deadline_monotonic':deadline}),0o400)
              need(time.monotonic()-started<220)
              runner="import runpy,sys;sys.path.insert(0,sys.argv[1]);sys.argv=[sys.argv[1]+'/hosted.py','run','--root',sys.argv[1]];runpy.run_path(sys.argv[0],run_name='__main__')"
              phase='PRIVATE_TIMER_CONSUMER'
              with (root/'private.stdout').open('xb') as out,(root/'private.stderr').open('xb') as err:
                  child=subprocess.Popen(['/usr/bin/python3','-I','-S','-B','-c',runner,str(root)],stdout=out,stderr=err,
                      env={'PATH':'/usr/bin:/bin','LANG':'C.UTF-8'})
                  while child.poll() is None:time.sleep(.02)
              need(child.returncode==0)
              result=decode((root/'complete.json').read_bytes())
              need(result['success'] is True and result['watchdog_admitted'] is False and result['gpu_work']==0 and result['spend_inr']==0)
              code=0
          except BaseException:code=2;failure_boundary=phase
          finally:
              # Disposal is bounded by the original absolute deadline, not a new reserve.
              signal.setitimer(signal.ITIMER_REAL,max(.000001,deadline-time.monotonic()))
              if child is not None and child.poll() is None:
                  child.terminate()
                  try:child.wait(timeout=max(.001,min(5,deadline-time.monotonic()-5)))
                  except Exception:
                      child.kill();code=2
                      try:child.wait(timeout=max(.001,min(1,deadline-time.monotonic())))
                      except Exception:code=2
              owned=False
              if identity is not None and root is not None:
                  try:owned=not root.is_symlink() and (root.stat().st_dev,root.stat().st_ino)==identity
                  except Exception:code=2
              if token:
                  try:
                      revocation_observation['failure_boundary']='DELETE_REQUEST'
                      request('DELETE','/installation/token',token,observation=revocation_observation)
                  except Exception:code=2
                  try:
                      # The independent probe still runs after an uncertain
                      # DELETE. It never retries revocation or treats403 as401.
                      revocation_observation['failure_boundary']='FRESH_PROBE'
                      if owned:
                          if not (root/'installation-token').exists():save(root/'installation-token',token.encode(),0o400)
