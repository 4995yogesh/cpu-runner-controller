name: Private account compatibility assessment
run-name: CPU account ${{ inputs.scope_id }}
on:
  workflow_dispatch:
    inputs:
      scope_id:
        required: true
        type: string
      reviewed_control_commit:
        required: true
        type: string
      reviewed_registry_sha256:
        required: true
        type: string
      reviewed_card_sha256:
        required: true
        type: string
      reviewed_app_id:
        required: true
        type: string
      owner_webhooks_disabled:
        required: true
        type: boolean
        default: false
      assessment_authorized:
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: cpu-connected-preparation
  cancel-in-progress: false
jobs:
  account-compatibility:
    name: account-compatibility
    if: ${{ inputs.assessment_authorized && inputs.owner_webhooks_disabled && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      CPU_SCOPE_ID: ${{ inputs.scope_id }}
      CPU_CONTROL_COMMIT: ${{ inputs.reviewed_control_commit }}
      CPU_SOURCE_REGISTRY_SHA256: ${{ inputs.reviewed_registry_sha256 }}
      CPU_CARD_SHA256: ${{ inputs.reviewed_card_sha256 }}
      CPU_EXPECTED_APP_ID: ${{ inputs.reviewed_app_id }}
      CPU_APP_CLIENT_ID: ${{ vars.CPU_APP_CLIENT_ID }}
      CPU_APP_INSTALLATION_ID: ${{ vars.CPU_APP_INSTALLATION_ID }}
      CPU_PRIVATE_REPOSITORY_ID: ${{ vars.CPU_PRIVATE_REPOSITORY_ID }}
      CPU_APP_BOT_ID: ${{ vars.CPU_APP_BOT_ID }}
      CPU_REVIEW_ISSUE_NUMBER: ${{ vars.CPU_REVIEW_ISSUE_NUMBER }}
      CPU_REVIEWER_ID: ${{ vars.CPU_REVIEWER_ID }}
      CPU_DRIVE_FOLDER_ID: ${{ vars.CPU_DRIVE_FOLDER_ID }}
    steps:
      - name: Verify private owner authority and assess dedicated credentials
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CPU_APP_PRIVATE_KEY: ${{ secrets.CPU_APP_PRIVATE_KEY }}
          CPU_DRIVE_RCLONE_CONF: ${{ secrets.CPU_DRIVE_RCLONE_CONF }}
        run: |
          set -euo pipefail
          sudo --preserve-env=GH_TOKEN,CPU_APP_PRIVATE_KEY,CPU_DRIVE_RCLONE_CONF,CPU_SCOPE_ID,CPU_CONTROL_COMMIT,CPU_SOURCE_REGISTRY_SHA256,CPU_CARD_SHA256,CPU_EXPECTED_APP_ID,CPU_APP_CLIENT_ID,CPU_APP_INSTALLATION_ID,CPU_PRIVATE_REPOSITORY_ID,CPU_APP_BOT_ID,CPU_REVIEW_ISSUE_NUMBER,CPU_REVIEWER_ID,CPU_DRIVE_FOLDER_ID,GITHUB_REPOSITORY,GITHUB_EVENT_NAME,GITHUB_RUN_ATTEMPT,GITHUB_SHA,GITHUB_WORKFLOW_SHA,GITHUB_RUN_ID,GITHUB_ACTOR_ID,GITHUB_JOB,RUNNER_OS,ImageOS,RUNNER_NAME /usr/bin/python3 -I -S -B - <<'PY'
          import base64,datetime,hashlib,http.client,json,os,re,resource,shutil,signal,ssl,subprocess,time,uuid
          from pathlib import Path
          os.umask(0o077)
          started=time.monotonic();deadline=started+115;root=None;identity=None;token=None;child=None;code=2
          def need(ok):
              if not ok:raise ValueError('ACCOUNT_ASSESSMENT_BOUNDARY')
          def encode(value):return (json.dumps(value,sort_keys=True,indent=2,allow_nan=False)+'\n').encode()
          def save(path,raw,mode=0o600):
              fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,mode)
              with os.fdopen(fd,'wb') as out:out.write(raw)
          def interrupted(_s,_f):
              left=deadline-time.monotonic()
              if left>0:signal.setitimer(signal.ITIMER_REAL,left)
              raise KeyboardInterrupt()
          signal.signal(signal.SIGALRM,interrupted);signal.signal(signal.SIGTERM,interrupted)
          signal.setitimer(signal.ITIMER_REAL,105)
          def request(method,path,credential,payload=None,raw=False):
              conn=http.client.HTTPSConnection('api.github.com',timeout=5,context=ssl.create_default_context())
              try:
                  headers={'Authorization':'Bearer '+credential,'User-Agent':'cpu-account-bootstrap','X-GitHub-Api-Version':'2026-03-10',
                      'Accept':'application/vnd.github.raw+json' if raw else 'application/vnd.github+json'}
                  if payload is not None:headers['Content-Type']='application/json'
                  conn.request(method,path,body=None if payload is None else encode(payload),headers=headers)
                  response=conn.getresponse();value=response.read(4194305)
                  need(response.status=={'GET':200,'POST':201,'DELETE':204}[method] and len(value)<=4194304)
                  return value if raw or method=='DELETE' else json.loads(value)
              finally:conn.close()
          try:
              need(os.getuid()==0 and os.environ['GITHUB_REPOSITORY']=='4995yogesh/cpu-runner-controller'
                  and os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch' and os.environ['GITHUB_RUN_ATTEMPT']=='1'
                  and os.environ['GITHUB_ACTOR_ID']=='183433787' and os.environ['GITHUB_JOB']=='account-compatibility'
                  and os.environ['GITHUB_SHA']==os.environ['GITHUB_WORKFLOW_SHA'] and os.environ['RUNNER_OS']=='Linux'
                  and os.environ['ImageOS']=='ubuntu24')
              for name,size in [('CPU_SCOPE_ID',32),('CPU_CONTROL_COMMIT',40),('CPU_SOURCE_REGISTRY_SHA256',64),('CPU_CARD_SHA256',64)]:
                  need(re.fullmatch('[0-9a-f]{'+str(size)+'}',os.environ[name]))
              account={'app_client_id':os.environ['CPU_APP_CLIENT_ID'],'installation_id':int(os.environ['CPU_APP_INSTALLATION_ID']),
                  'private_repository_id':int(os.environ['CPU_PRIVATE_REPOSITORY_ID']),'bot_user_id':int(os.environ['CPU_APP_BOT_ID']),
                  'review_issue':int(os.environ['CPU_REVIEW_ISSUE_NUMBER']),'reviewer_id':int(os.environ['CPU_REVIEWER_ID']),
                  'drive_folder_id':os.environ['CPU_DRIVE_FOLDER_ID'],'unused_webhooks_disabled':True}
              need(account['private_repository_id']==1401402576 and account['reviewer_id']==183433787 and account['review_issue']==1)
              public=os.environ['GH_TOKEN'];repo='4995yogesh/cpu-runner-controller';private='4995yogesh/Phase3-cpu-probe-staging'
              run=request('GET','/repos/'+repo+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],public)
              need(run['repository']['id']==1408565081 and run['repository']['full_name']==repo
                  and run['repository']['private'] is False and run['head_sha']==os.environ['GITHUB_SHA']
                  and run['event']=='workflow_dispatch' and run['run_attempt']==1 and run['status']=='in_progress'
                  and run['actor']['id']==run['triggering_actor']['id']==183433787
                  and run['path'].split('@',1)[0]=='.github/workflows/account-credential-assessment.yml'
                  and run['display_title']=='CPU account '+os.environ['CPU_SCOPE_ID'])
              jobs=request('GET','/repos/'+repo+'/actions/runs/'+os.environ['GITHUB_RUN_ID']+'/jobs?per_page=100',public)
              need(jobs['total_count']==1 and len(jobs['jobs'])==1);job=jobs['jobs'][0]
              need(job['name']=='account-compatibility' and job['status']=='in_progress' and job['runner_name']==os.environ['RUNNER_NAME'])
              age=(datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(job['started_at'].replace('Z','+00:00'))).total_seconds()
              need(0<=age<108);deadline=min(deadline,time.monotonic()+118-age)
              need(deadline-time.monotonic()>10);signal.setitimer(signal.ITIMER_REAL,deadline-time.monotonic()-10)
              matched=[]
              for page in range(1,21):
                  rows=request('GET',f'/repos/{repo}/actions/workflows/{run["workflow_id"]}/runs?event=workflow_dispatch&per_page=100&page={page}',public)['workflow_runs']
                  matched.extend(r for r in rows if r.get('display_title')==run['display_title'])
                  if len(rows)<100:break
              else:raise ValueError('ACCOUNT_ASSESSMENT_BOUNDARY')
              need(len(matched)==1 and matched[0]['id']==run['id'] and matched[0]['run_attempt']==1)
              resource.setrlimit(resource.RLIMIT_CORE,(0,0));resource.setrlimit(resource.RLIMIT_AS,(268435456,268435456))
              resource.setrlimit(resource.RLIMIT_CPU,(30,30));resource.setrlimit(resource.RLIMIT_FSIZE,(2097152,2097152))
              storage=Path('/var/lib');need(all(not p.is_symlink() and p.stat().st_uid==0 and not p.stat().st_mode&0o022 for p in (storage,*storage.parents)))
              root=storage/('cpu-account-assessment-'+str(run['id'])+'-1-'+uuid.uuid4().hex[:12]);root.mkdir(mode=0o700)
              identity=(root.stat().st_dev,root.stat().st_ino)
              raw=os.environ.pop('CPU_APP_PRIVATE_KEY');need(0<len(raw.encode())<=16384);save(root/'app.pem',raw.encode(),0o400);raw=None
              b64=lambda value:base64.urlsafe_b64encode(value).rstrip(b'=')
              stamp=int(time.time());signed=b'.'.join([b64(b'{"alg":"RS256","typ":"JWT"}'),b64(encode({'iss':account['app_client_id'],'iat':stamp-60,'exp':stamp+540}))])
              signature=subprocess.run(['/usr/bin/openssl','dgst','-sha256','-sign',str(root/'app.pem')],input=signed,capture_output=True,timeout=5,check=True).stdout
              jwt=(signed+b'.'+b64(signature)).decode();permissions={'contents':'read','issues':'write','metadata':'read'}
              app=request('GET','/app',jwt)
              need(app['id']==int(os.environ['CPU_EXPECTED_APP_ID']) and app['owner']['id']==183433787 and app['permissions']==permissions and app['events']==[])
              installs=request('GET','/app/installations?per_page=100&page=1',jwt)
              need(len(installs)==1);install=installs[0]
              need(install['id']==account['installation_id'] and install['app_id']==app['id'] and install['account']['id']==183433787
                  and install['account']['type']=='User' and install['permissions']==permissions and install['repository_selection']=='selected')
              minted=request('POST',f'/app/installations/{account["installation_id"]}/access_tokens',jwt,{'permissions':permissions});token=minted.get('token')
              need(isinstance(token,str) and token and minted['permissions']==permissions and minted['repository_selection']=='selected'
                  and len(minted['repositories'])==1 and minted['repositories'][0]['id']==1401402576
                  and minted['repositories'][0]['full_name']==private and minted['repositories'][0]['private'] is True)
              issue=request('GET',f'/repos/{private}/issues/1',token)
              need(issue['state']=='open' and 'pull_request' not in issue and issue['user']['id']==183433787)
              expected={'scope_id':os.environ['CPU_SCOPE_ID'],'card_sha256':os.environ['CPU_CARD_SHA256'],
                  'operation':'cpu-public-runner-actions-credential-assessment','control_commit':os.environ['CPU_CONTROL_COMMIT'],
                  'registry_sha256':os.environ['CPU_SOURCE_REGISTRY_SHA256'],'execution_repository':repo,'execution_commit':os.environ['GITHUB_SHA'],
                  'approved':True,'test_evidence':False,'paid_spend_ceiling_inr':0}
              found=[]
              for page in range(1,21):
                  rows=request('GET',f'/repos/{private}/issues/1/comments?per_page=100&page={page}',token)
                  for row in rows:
                      body=row.get('body','')
                      if not body.startswith('CPU_PUBLIC_RUNNER_CREDENTIAL_ASSESSMENT_V2\n') or os.environ['CPU_SCOPE_ID'] not in body:continue
                      need(row['user']['id']==183433787 and row['user']['type']=='User' and row['author_association']=='OWNER'
                          and row['created_at']==row['updated_at'] and json.loads(body.split('\n',1)[1])==expected)
                      age=(datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(row['created_at'].replace('Z','+00:00'))).total_seconds()
                      need(0<=age<=3600);found.append(row['id'])
                  if len(rows)<100:break
              else:raise ValueError('ACCOUNT_ASSESSMENT_BOUNDARY')
              need(len(found)==1)
              # Drive credentials are not materialized or used before private owner authority.
              raw=os.environ.pop('CPU_DRIVE_RCLONE_CONF');need(0<len(raw.encode())<=16384);save(root/'incoming.conf',raw.encode());raw=None
              # No private implementation is fetched/executed before this owner gate.
              commit=request('GET',f'/repos/{private}/git/commits/'+os.environ['CPU_CONTROL_COMMIT'],token)
              need(commit['sha']==os.environ['CPU_CONTROL_COMMIT'])
              tree=request('GET',f'/repos/{private}/git/trees/'+commit['tree']['sha']+'?recursive=1',token);need(tree['truncated'] is False)
              entries={r['path']:r for r in tree['tree']};total=0
              def fetch(name):
                  global total
                  row=entries['operations/public_runner_runtime/'+name];need(row['type']=='blob' and row['mode']=='100644')
                  value=request('GET',f'/repos/{private}/git/blobs/'+row['sha'],token,raw=True);total+=len(value)
                  need(total<=262144 and hashlib.sha1(b'blob '+str(len(value)).encode()+b'\0'+value).hexdigest()==row['sha'])
                  return value
              raw=fetch('source-registry.json');need(hashlib.sha256(raw).hexdigest()==os.environ['CPU_SOURCE_REGISTRY_SHA256'])
              registry=json.loads(raw);save(root/'source-registry.json',raw)
              for name in ['actions_assessment.py','credential_assessment.py','bridge.py','secure_drive.py','private_evidence.py','account-workflow.candidate.yml']:
                  raw=fetch(name);need(registry['files'][name]=={'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()});save(root/name,raw)
              save(root/'installation.json',encode(minted),0o400)
              binding={'account':account,'expected_app_id':app['id'],'control_commit':os.environ['CPU_CONTROL_COMMIT'],
                  'registry_sha256':os.environ['CPU_SOURCE_REGISTRY_SHA256'],'scope_id':os.environ['CPU_SCOPE_ID'],
                  'card_sha256':os.environ['CPU_CARD_SHA256'],'execution_commit':os.environ['GITHUB_SHA'],
                  'run_id':str(run['id']),'job_id':job['id']}
              save(root/'job.json',encode(binding))
              # -I excludes private sibling modules; add only the protected reviewed root.
              runner="import runpy,sys;sys.path.insert(0,sys.argv[1]);sys.argv=[sys.argv[1]+'/actions_assessment.py','run','--root',sys.argv[1]];runpy.run_path(sys.argv[0],run_name='__main__')"
              with (root/'private.stdout').open('xb') as out,(root/'private.stderr').open('xb') as err:
                  child=subprocess.Popen(['/usr/bin/python3','-I','-S','-B','-c',runner,str(root)],stdout=out,stderr=err,env=dict(os.environ))
                  while child.poll() is None:time.sleep(.02)
              need(child.returncode==0 and (root/'revocation-complete.json').exists())
              result=json.loads((root/'result.json').read_bytes())
              need(result['assessment_token_revoked'] is True and result['temporary_config_removed'] is True
                  and result['evidence_kind']=='GENUINE_ACCOUNT_OBSERVATION' and result['card_sha256']==os.environ['CPU_CARD_SHA256'])
              code=0
          except BaseException:code=2
          finally:
              # Disposal is bounded by the original absolute deadline, not a new reserve.
              signal.setitimer(signal.ITIMER_REAL,max(.000001,deadline-time.monotonic()))
              if child is not None and child.poll() is None:
                  child.terminate()
                  try:child.wait(timeout=max(.001,deadline-time.monotonic()-5))
                  except Exception:
                      child.kill();code=2
                      try:child.wait(timeout=max(.001,min(1,deadline-time.monotonic())))
                      except Exception:code=2
              owned=False
              if identity is not None and root is not None:
                  try:owned=not root.is_symlink() and (root.stat().st_dev,root.stat().st_ino)==identity
                  except Exception:code=2
              if token:
                  if child is not None and not owned:code=2
                  elif owned and (root/'revocation-attempt.json').exists():
                      if not (root/'revocation-complete.json').exists():code=2
                  else:
                      try:request('DELETE','/installation/token',token)
                      except Exception:code=2
              token=None
              os.environ.pop('CPU_APP_PRIVATE_KEY',None);os.environ.pop('CPU_DRIVE_RCLONE_CONF',None);os.environ.pop('GH_TOKEN',None)
              try:
                  need(owned and shutil.rmtree.avoids_symlink_attacks)
                  for name in ['app.pem','incoming.conf','installation.json']:(root/name).unlink(missing_ok=True)
                  snapshot=root/'.phase3r-a2-rclone-private'
                  if snapshot.exists():need(not snapshot.is_symlink());shutil.rmtree(snapshot)
                  check="from pathlib import Path;import sys;root=Path(sys.argv[1]);paths=[root/n for n in ['app.pem','incoming.conf','installation.json','.phase3r-a2-rclone-private']];sys.exit(0 if all(not p.exists() and not p.is_symlink() for p in paths) else 2)"
                  observation=subprocess.run(['/usr/bin/python3','-I','-S','-B','-c',check,str(root)],capture_output=True,
                      env={'PATH':'/usr/bin:/bin','LANG':'C.UTF-8'},timeout=min(2,max(.001,deadline-time.monotonic())))
                  need(observation.returncode==0 and time.monotonic()<=deadline)
                  if code==0:
                      shutil.rmtree(root)
                      print('{"status":"CPU_ACCOUNT_ASSESSMENT_COMPLETED_AND_DISPOSED","runtime_admission_granted":false,"accepted_for_qualification":false,"gpu_work":0,"spend_inr":0}')
              except Exception:code=2
              signal.setitimer(signal.ITIMER_REAL,0)
          if code!=0:print('{"status":"CPU_ACCOUNT_ASSESSMENT_BLOCKED","runtime_admission_granted":false,"accepted_for_qualification":false,"gpu_work":0,"spend_inr":0}')
          raise SystemExit(code)
          PY
